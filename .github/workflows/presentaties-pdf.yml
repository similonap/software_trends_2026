name: Presentaties als pdf

# Bouwt van elke presentatie een pdf en zet ze bij de release "presentaties",
# zodat iedereen ze zonder login kan downloaden.
# Start vanzelf als de slides op main wijzigen, of met de hand via "Run workflow".
on:
  push:
    branches: [main]
    paths:
      - '*-slides/**'
      - 'supply-chain/slides/**'
      - 'tools/maak_pdf.py'
      - '.github/workflows/presentaties-pdf.yml'
  workflow_dispatch:

permissions:
  contents: write  # nodig om de release bij te werken

# Een nieuwe push maakt de run van de vorige push overbodig.
concurrency:
  group: presentaties-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Arial bestaat niet op Linux: Liberation Sans heeft dezelfde afmetingen.
      # DejaVu en Noto Color Emoji leveren de tekens ✓ ✗ en de emoji.
      - name: Lettertypes installeren
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-liberation fonts-dejavu-core fonts-noto-color-emoji

      - name: Pdf's bouwen
        run: python3 tools/maak_pdf.py

      - uses: actions/upload-artifact@v7
        with:
          name: presentaties-pdf
          path: pdf/*.pdf
          if-no-files-found: error

      # Eén vaste release met telkens de nieuwste pdf's: de downloadlinks blijven dezelfde.
      - name: Pdf's publiceren bij de release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notities="De slides van elke les als pdf. Laatst gebouwd op $(TZ=Europe/Brussels date '+%d-%m-%Y om %H:%M') uit commit ${GITHUB_SHA::7}."
          if gh release view presentaties > /dev/null 2>&1; then
            gh release edit presentaties --notes "$notities"
          else
            gh release create presentaties --target "$GITHUB_SHA" --title "Presentaties (pdf)" --notes "$notities"
          fi
          gh release upload presentaties pdf/*.pdf --clobber
