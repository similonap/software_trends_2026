    <div data-hf-id="hf-32lj" id="exfil-07-kicker"><span data-hf-id="hf-u6h2" class="exfil-07-rule"></span><span data-hf-id="hf-5xlz">03 / PAYLOAD</span></div>

    <div data-hf-id="hf-cqwg" id="exfil-07-counter">
      <span data-hf-id="hf-oynk" class="exfil-07-clabel">BASE64</span>
      <span data-hf-id="hf-7cvq" id="exfil-07-count">×1</span>

    <div data-hf-id="hf-q8ta" id="exfil-07-card">

          <path data-hf-id="hf-rvxi" d="M5 3h14v15H7a2 2 0 0 0-2 2V3z"/>

    <div data-hf-id="hf-4sgf" id="exfil-07-block"></div>
  </div>

  <script>
    (function () {
      const DUR = 7.12;
      const COLS = 40;
      const ROWS = 5;
      const B64 = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/";

      // ---- states: plaintext, then three real base64 passes ----
      const plainLines = [
        "NPM_TOKEN=npm_************",
        "GITHUB_TOKEN=ghp_************",
        "~/.ssh/id_rsa"
      ];
      function toCells(lines) {
        const out = [];
        for (let r = 0; r < ROWS; r++) {
          const line = lines[r] || "";
          for (let c = 0; c < COLS; c++) out.push(line[c] || "");
        }
        return out;
      }
      function wrap(str) {
        const lines = [];
        for (let i = 0; i < str.length; i += COLS) lines.push(str.slice(i, i + COLS));
        return lines;
      }
      const s0 = plainLines.join("\n");
      const e1 = btoa(s0), e2 = btoa(e1), e3 = btoa(e2);
      const states = [toCells(plainLines), toCells(wrap(e1)), toCells(wrap(e2)), toCells(wrap(e3))];

      // ---- build grid ----
      const block = document.getElementById("exfil-07-block");
      const cells = [];
      for (let r = 0; r < ROWS; r++) {
        const row = document.createElement("div");
        row.className = "exfil-07-row";
        for (let c = 0; c < COLS; c++) {
          const span = document.createElement("span");
          span.className = "exfil-07-cell";
          span.textContent = " ";
          row.appendChild(span);
          cells.push({ el: span, txt: null, rot: null, op: null });
        }
        block.appendChild(row);
      }

      // ---- repo name cells ----
      const NAME = "s1ngularity-repository";
      const OWNER = "jij/";
      const nameEl = document.getElementById("exfil-07-name");
      const ownerEl = document.getElementById("exfil-07-owner");
      const nameCells = [...NAME].map((ch) => {
        const s = document.createElement("span");
        s.className = "exfil-07-ncell";
        s.textContent = ch;
        nameEl.appendChild(s);
        return { el: s, target: ch, txt: null, rot: null, op: null };
      });
      const ownerCells = [...OWNER].map((ch) => {
        const s = document.createElement("span");
        s.className = "exfil-07-ochar";
        s.textContent = ch;
        s.style.opacity = "0";
        ownerEl.appendChild(s);
        return s;
      });
      const nameRow = document.getElementById("exfil-07-namerow");
      const CHAR_W = 46 * 0.6;
      const OWNER_W = OWNER.length * CHAR_W;

      const countEl = document.getElementById("exfil-07-count");

      // ---- hacker-flip decode schedule (each pass longer) ----
      const PASS_START = [0.95, 1.6, 2.3];
      const PASS_FLIP = [0.32, 0.38, 0.45];
      const PASS_STAG = [0.0012, 0.0016, 0.002];
      const REVEAL = 0.6;

      function pseudoGlyph(seed) {
        const h = ((seed * 9301 + 49297) % 233280) / 233280;
        return B64[Math.floor(h * B64.length)];
      }
      function setCell(cell, txt, rot, op) {
        if (cell.txt !== txt) { cell.el.textContent = txt; cell.txt = txt; }
        if (cell.rot !== rot) { cell.el.style.transform = rot === 0 ? "none" : "rotateX(" + rot + "deg)"; cell.rot = rot; }
        if (cell.op !== op) { cell.el.style.opacity = String(op); cell.op = op; }
      }
      function ease3(p) { return 1 - Math.pow(1 - p, 3); }

      let lastCount = null;
      function render(t) {
        // base64 block passes
        for (let i = 0; i < cells.length; i++) {
          let k = -1, p = 1;
          for (let j = 2; j >= 0; j--) {
            const st = PASS_START[j] + i * PASS_STAG[j];
            if (t >= st) { k = j; p = Math.min(1, (t - st) / PASS_FLIP[j]); break; }
          }
          if (k < 0) { setCell(cells[i], states[0][i] || " ", 0, 1); continue; }
          const from = states[k][i], to = states[k + 1][i];
          if (!from && !to) { setCell(cells[i], " ", 0, 1); continue; }
          if (p >= 1) { setCell(cells[i], to || " ", 0, 1); continue; }
          const ep = ease3(p);
          const txt = ep < REVEAL ? pseudoGlyph(i * 1000 + (k + 1) * 100003 + Math.floor(p * 4)) : (to || " ");
          setCell(cells[i], txt, Math.round(90 - ep * 90), Math.min(1, Math.round(ep * 2 * 100) / 100));
        }
        // ×N counter
        let n = 1;
        if (t >= PASS_START[2]) n = 3; else if (t >= PASS_START[1]) n = 2;
        if (n !== lastCount) { countEl.textContent = "×" + n; lastCount = n; }

        // repo name decode (hacker-flip)
        const NSTART = 3.6, NSTAG = 0.03, NFLIP = 0.42;
        for (let i = 0; i < nameCells.length; i++) {
          const c = nameCells[i];
          const p = Math.max(0, Math.min(1, (t - NSTART - i * NSTAG) / NFLIP));
          const ep = ease3(p);
          const txt = ep < REVEAL ? pseudoGlyph(i * 777 + 31 + Math.floor(p * 5)) : c.target;
          setCell(c, txt, Math.round(90 - ep * 90), Math.min(1, Math.round(ep * 2 * 100) / 100));
        }

        // owner "jij/" types in front, pushing the name right
        const TYPE_START = 5.5, TYPE_STEP = 0.11;
        let typed = 0;
        for (let i = 0; i < ownerCells.length; i++) {
          const on = t >= TYPE_START + i * TYPE_STEP;
          if (on) typed = i + 1;
          ownerCells[i].style.opacity = on ? "1" : "0";
        }
        nameRow.style.transform = "translateX(" + (-OWNER_W + typed * CHAR_W) + "px)";
      }

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // driver for all glyph state (pure function of time → seek-safe)
      const proxy = { t: 0 };
      render(0);
      tl.to(proxy, { t: DUR, duration: DUR, ease: "none", onUpdate: () => render(proxy.t) }, 0);

      // Scene 1 — kicker + plaintext block + counter
      tl.fromTo("#exfil-07-kicker", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.45, ease: "power3.out" }, 0.05);
      tl.fromTo("#exfil-07-block", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 0.1);
      tl.fromTo("#exfil-07-counter", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 0.85);
      tl.fromTo("#exfil-07-count", { scale: 1.35 }, { scale: 1, duration: 0.35, ease: "back.out(2)" }, PASS_START[0]);
      tl.fromTo("#exfil-07-count", { scale: 1.35 }, { scale: 1, duration: 0.35, ease: "back.out(2)", immediateRender: false }, PASS_START[1]);
      tl.fromTo("#exfil-07-count", { scale: 1.5 }, { scale: 1, duration: 0.45, ease: "back.out(2)", immediateRender: false }, PASS_START[2]);

      // slow macro push under the whole shot
      tl.fromTo("#exfil-07-stage", { scale: 1 }, { scale: 1.035, duration: DUR, ease: "sine.inOut" }, 0);

      // Scene 2 — card appears right, block shrinks into it
      tl.fromTo("#exfil-07-card", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.55, ease: "power3.out" }, 3.25);
      tl.fromTo("#exfil-07-rulehair", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 3.5);
      tl.fromTo("#exfil-07-file", { opacity: 0, x: -12 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 3.75);
      // block: (106,300) → card preview (1000,520), scale 0.8
      tl.fromTo("#exfil-07-block",
        { x: 0, y: 0, scale: 1, opacity: 1 },
        { x: 894, y: 220, scale: 0.8, opacity: 0.45, duration: 0.85, ease: "power3.inOut", immediateRender: false }, 3.4);
      tl.fromTo("#exfil-07-counter", { opacity: 1 }, { opacity: 0.35, duration: 0.6, ease: "power2.out", immediateRender: false }, 3.5);
      tl.fromTo("#exfil-07-badge", { opacity: 0, scale: 1.45 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.2)" }, 4.3);

      // Scene 3 — "jij/" typed by render(); quiet hold after

      window.__timelines["07-exfil"] = tl;
    })();
  </script>
