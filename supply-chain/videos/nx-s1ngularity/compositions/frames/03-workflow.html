<script>
  (function () {
    var DUR = 9.52;
    var tl = gsap.timeline({ paused: true });
    var $ = function (id) { return document.getElementById(id); };

    // ---- discrete text sequences (reverse-searched each update) ----
    function seq(states) { return states; }
    function textAt(states, t) {
      for (var i = states.length - 1; i >= 0; i--) if (t >= states[i].t) return states[i].text;
      return "";
    }
    var S = {
      "w03-l1k": seq([{ t: 0, text: "" }, { t: 1.00, text: "o" }, { t: 1.07, text: "on" }, { t: 1.14, text: "on:" }, { t: 1.22, text: "on: " }]),
      "w03-l1v": seq([{ t: 0, text: "" }, { t: 1.34, text: "pull" }, { t: 1.48, text: "pull_req" }, { t: 1.60, text: "pull_request" }, { t: 1.80, text: "pull_request_tar" }, { t: 1.92, text: "pull_request_target" }]),
      "w03-l2": seq([{ t: 0, text: "" }, { t: 2.10, text: "jo" }, { t: 2.20, text: "jobs:" }]),
      "w03-l3": seq([{ t: 0, text: "" }, { t: 2.42, text: "  val" }, { t: 2.54, text: "  valida" }, { t: 2.66, text: "  validate-" }, { t: 2.80, text: "  validate-tit" }, { t: 2.92, text: "  validate-title:" }]),
      "w03-l4k": seq([{ t: 0, text: "" }, { t: 4.28, text: "    ru" }, { t: 4.38, text: "    run:" }]),
      "w03-l4v": seq([{ t: 0, text: "" }, { t: 4.50, text: " ec" }, { t: 4.60, text: " echo" }, { t: 4.70, text: " echo \"" }]),
      // bulk paste of the expression on "titel"
      "w03-expr": seq([{ t: 0, text: "" }, { t: 4.86, text: "${{ github.event.pull_request.title }}" }]),
      "w03-l4q": seq([{ t: 0, text: "" }, { t: 5.04, text: "\"" }])
    };
    var ids = Object.keys(S);
    var els = ids.map($);

    // which line owns the cursor
    var cursors = [$("w03-c1"), $("w03-c2"), $("w03-c3"), $("w03-c4")];
    function activeLine(t) {
      if (t < 0.9) return 0;       // waiting on line 1
      if (t < 2.02) return 0;
      if (t < 2.32) return 1;
      if (t < 4.2) return 2;
      return 3;
    }

    var driver = { t: 0 };
    tl.to(driver, {
      t: DUR,
      duration: DUR,
      ease: "none",
      onUpdate: function () {
        var t = driver.t;
        for (var i = 0; i < ids.length; i++) {
          var txt = textAt(S[ids[i]], t);
          if (els[i].textContent !== txt) els[i].textContent = txt;
        }
        // deterministic sin-square blink, ~0.6s cycle; solid while typing
        var a = activeLine(t);
        var typing = (t > 1.0 && t < 1.95) || (t > 2.1 && t < 2.22) || (t > 2.42 && t < 2.95) || (t > 4.28 && t < 5.06);
        var on = typing || Math.sin(t * Math.PI * 2 / 0.6) > 0;
        var hide = t < 0.5 || t > 8.0; // cursor gone once the payload lands
        for (var c = 0; c < cursors.length; c++) {
          cursors[c].style.opacity = (!hide && c === a && on) ? "1" : "0";
        }
      }
    }, 0);

    // ---- Scene 1 (0.0–3.2): chrome + panel + first three lines ----
    tl.fromTo("#w03-kicker", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.05);
    tl.fromTo("#w03-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 0.2);
    tl.fromTo("#w03-panel", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.7, ease: "power3.out" }, 0.15);
    tl.fromTo("#w03-divider", { scaleY: 0 }, { scaleY: 1, duration: 0.8, ease: "power2.inOut" }, 0.5);
    // fire-orange underline on pull_request_target as VO reaches "pull requests"
    tl.fromTo("#w03-ul", { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power2.out" }, 2.24);

    // slow macro push-in underneath the whole shot
    tl.fromTo("#w03-stage", { scale: 1 }, { scale: 1.035, duration: DUR, ease: "none" }, 0);

    // ---- Scene 2 (3.2–6.0): run line types, marker box draws round ${{ }} ----
    tl.fromTo("#w03-st", { scaleX: 0 }, { scaleX: 1, duration: 0.18, ease: "power1.in" }, 5.30);
    tl.fromTo("#w03-sr", { scaleY: 0 }, { scaleY: 1, duration: 0.08, ease: "none" }, 5.48);
    tl.fromTo("#w03-sb", { scaleX: 0 }, { scaleX: 1, duration: 0.18, ease: "none" }, 5.56);
    tl.fromTo("#w03-sl", { scaleY: 0 }, { scaleY: 1, duration: 0.10, ease: "power1.out" }, 5.74);

    // ---- Scene 3 (6.0–9.52): PR-title strip slides in, drops into the slot ----
    tl.fromTo("#w03-rail-label", { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 6.96);
    tl.fromTo("#w03-card", { x: 620, opacity: 1 }, { x: 0, opacity: 1, duration: 0.6, ease: "power3.out" }, 7.0);

    // flight: card text clears, orange fill shrinks/moves onto the slot rect
    // card origin (1356,490) 458x196 -> slot rect: panel(106+1)+code(40)+box(262) , panel(260+1)+code(104)+line(180)+box(4)
    var slotX = 107 + 40 + 262, slotY = 261 + 104 + 180 + 4;
    var dx = slotX - 1356, dy = slotY - 490;
    tl.fromTo("#w03-card-body", { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "power1.in" }, 7.95);
    tl.fromTo("#w03-rail-label", { opacity: 1 }, { opacity: 0.35, duration: 0.3, ease: "power1.out", immediateRender: false }, 7.95);
    tl.fromTo("#w03-card", { x: 0, y: 0 }, { x: dx, y: dy, duration: 0.5, ease: "power3.inOut", immediateRender: false }, 8.0);
    tl.fromTo("#w03-card-fill", { scaleX: 1, scaleY: 1 }, { scaleX: 844 / 458, scaleY: 52 / 196, duration: 0.5, ease: "power3.inOut" }, 8.0);

    // swap: ${{ }} out, shellcode in (instant discrete swap under the fill)
    tl.set("#w03-expr", { display: "none" }, 8.48);
    tl.set("#w03-shell", { display: "inline" }, 8.48);
    tl.fromTo("#w03-box", { width: 700 }, { width: 844, duration: 0.01, ease: "none" }, 8.48);
    // fill collapses toward the slot start, revealing the orange payload inside the box
    tl.to("#w03-card-fill", { scaleX: 0, duration: 0.35, ease: "power2.inOut" }, 8.52);
    tl.fromTo("#w03-shell", { opacity: 0.6 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 8.52);
    // hold still ~last second

    window.__timelines = window.__timelines || {};
    window.__timelines["03-workflow"] = tl;
  })();
</script>
