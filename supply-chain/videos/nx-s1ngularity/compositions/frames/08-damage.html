<script>
(function () {
  window.__timelines = window.__timelines || {};
  var tl = gsap.timeline({ paused: true });
  var DUR = 13.6;

  // --- macro camera: slow steady push-in under the whole shot ---
  tl.fromTo("#d08-cam", { scale: 1 }, { scale: 1.035, duration: DUR, ease: "none" }, 0);

  // --- Scene 1 (0.0–4.4): chrome + empty triptych slots, card 1 on "2.349" ---
  tl.fromTo("#d08-rule", { scaleX: 0, transformOrigin: "left center" }, { scaleX: 1, duration: 0.4, ease: "power3.out" }, 0.05);
  tl.fromTo("#d08-kicker", { opacity: 0, x: -16 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, 0.1);
  tl.fromTo("#d08-catnum", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 0.2);
  tl.fromTo("#d08-chrome-line", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power3.inOut" }, 0.1);
  tl.fromTo("#d08-foot", { scaleX: 0 }, { scaleX: 1, duration: 0.9, ease: "power3.inOut" }, 0.2);

  // empty slots — the three top hairlines + catalogue indices establish the grid
  tl.fromTo(".d08-top", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power3.out", stagger: 0.08 }, 0.15);
  tl.fromTo(".d08-idx", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out", stagger: 0.08 }, 0.35);

  // accent bars all start empty
  tl.set(".d08-top-accent", { scaleX: 0 }, 0);

  // card bodies: rise in on their own spoken number
  function rise(sel, at) {
    tl.fromTo(sel, { opacity: 0, y: 48 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, at);
  }
  function accent(sel, at) {
    tl.fromTo(sel, { scaleX: 0 }, { scaleX: 1, duration: 0.5, ease: "power3.out" }, at);
  }

  // card 1 — hero, visible early; count lands on "2.349" (1.16s)
  rise("#d08-body1", 0.3);
  accent("#d08-acc1", 1.1);

  var num1 = document.getElementById("d08-num1");
  function fmtNL(n) {
    n = Math.round(n);
    if (n < 1000) return String(n);
    var r = n % 1000;
    return Math.floor(n / 1000) + "." + (r < 10 ? "00" : r < 100 ? "0" : "") + r;
  }
  var c1 = { v: 0 };
  var C1_AT = 1.1, C1_DUR = 1.8;
  tl.to(c1, {
    v: 2349, duration: C1_DUR, ease: "power3.out",
    onUpdate: function () { num1.textContent = fmtNL(c1.v); }
  }, C1_AT);
  tl.fromTo("#d08-num1", { scale: 0.5 }, { scale: 1, duration: C1_DUR, ease: "power3.out" }, C1_AT);
  tl.fromTo("#d08-lab1", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 1.85);

  // --- Scene 2 (4.4–8.6): card 2 on "95 van de 366" ---
  rise("#d08-body2", 5.9);
  accent("#d08-acc2", 6.25);
  var num2 = document.getElementById("d08-num2");
  var c2 = { v: 0 };
  var C2_AT = 6.25, C2_DUR = 1.2;
  tl.to(c2, {
    v: 95, duration: C2_DUR, ease: "power3.out",
    onUpdate: function () { num2.textContent = String(Math.round(c2.v)); }
  }, C2_AT);
  tl.fromTo("#d08-num2", { scale: 0.55 }, { scale: 1, duration: C2_DUR, ease: "power3.out" }, C2_AT);
  tl.fromTo("#d08-lab2", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 6.6);
  // "/ 366" lands on "366" (7.44s), then the bar fills to 95/366 ≈ 26%
  tl.fromTo("#d08-of", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "back.out(1.6)" }, 7.42);
  tl.fromTo("#d08-fill", { scaleX: 0 }, { scaleX: 95 / 366, duration: 1.0, ease: "power2.out" }, 7.6);
  tl.fromTo("#d08-pct", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 8.3);

  // --- Scene 3 (8.6–13.6): card 3 on "tweede golf", PRIVATE struck → PUBLIC ---
  rise("#d08-body3", 9.85);
  accent("#d08-acc3", 10.3);
  tl.fromTo("#d08-lab3", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" }, 10.3);

  // discrete state swap — instant jumps, reverse-searched each frame
  var SEQ = [
    { t: 0.0, text: "" },
    { t: 10.0, text: "_" },
    { t: 11.44, text: "PRIVATE" },
    { t: 12.62, text: "PUBLIC" }
  ];
  var stateEl = document.getElementById("d08-state");
  function textAt(time) {
    for (var i = SEQ.length - 1; i >= 0; i--) {
      if (time >= SEQ[i].t) return SEQ[i].text;
    }
    return "";
  }
  var drv = { t: 0 };
  tl.to(drv, {
    t: DUR, duration: DUR, ease: "none",
    onUpdate: function () {
      var txt = textAt(drv.t);
      stateEl.textContent = txt;
      stateEl.style.color = drv.t >= 12.62 ? "#E85D26" : (txt === "_" ? "#505048" : "#F0ECE5");
    }
  }, 0);

  // strike-through draws across PRIVATE, then vanishes on the swap
  tl.fromTo("#d08-strike", { scaleX: 0, opacity: 1 }, { scaleX: 1, duration: 0.35, ease: "power3.out" }, 12.1);
  tl.set("#d08-strike", { opacity: 0 }, 12.62);
  // PUBLIC punch — a small settle, no exit
  tl.fromTo("#d08-state-box", { scale: 1 }, { scale: 1.06, duration: 0.12, ease: "power2.out", immediateRender: false }, 12.62);
  tl.to("#d08-state-box", { scale: 1, duration: 0.3, ease: "power2.out" }, 12.74);

  // hold all three still to the end
  tl.to({}, { duration: DUR }, 0);

  window.__timelines["08-damage"] = tl;
})();
</script>
